services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ../.env
    networks:
      - agent_platform
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
    container_name: proxy
    depends_on:
      - frontend
      - backend
    networks:
      - agent_platform
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend/src:/app/src:Z
    networks:
      - agent_platform
    restart: unless-stopped

  database:
    container_name: database
    # volumes:
    #   - database:/var/lib/postgresql/data:Z
    build:
      context: ./database
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    networks:
      - agent_platform

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {DB_AUTH_NAME} -d {DB_AUTH_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10



networks:
  agent_platform:
    driver: bridge

volumes:
  database:
    driver: local
